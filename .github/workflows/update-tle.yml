name: Aggiorna orbita ISS

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iss-tle
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Scarica il TLE aggiornato della ISS
        run: |
          mkdir -p data
          rm -f data/iss.tle.new

          if ! curl --fail --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 60 \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            'https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE' \
            --output data/iss.tle.new; then
            echo "::warning::CelesTrak non raggiungibile. Mantengo l'ultimo TLE valido già presente nel repository."
            rm -f data/iss.tle.new
            exit 0
          fi

          if ! grep -q '^1 25544' data/iss.tle.new || ! grep -q '^2 25544' data/iss.tle.new; then
            echo "::warning::Il file ricevuto da CelesTrak non contiene un TLE ISS valido. Mantengo l'ultimo TLE valido."
            rm -f data/iss.tle.new
            exit 0
          fi

          mv data/iss.tle.new data/iss.tle

      - name: Pubblica il TLE senza conflitti con altri workflow
        shell: bash
        run: |
          set -euo pipefail

          # Salva il TLE scaricato prima di riallinearsi al branch remoto.
          candidate="$(mktemp)"
          cp data/iss.tle "$candidate"
          trap 'rm -f "$candidate"' EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Il checkout qui è temporaneo: reset non modifica il repository remoto.
            git fetch origin main
            git reset --hard origin/main

            # Protegge un TLE remoto con epoca più recente del candidato.
            python3 - "$candidate" data/iss.tle <<'PY'
          import pathlib
          import shutil
          import sys

          candidate, current = map(pathlib.Path, sys.argv[1:])
          def epoch(path):
              if not path.exists():
                  return -1.0
              for line in path.read_text().splitlines():
                  if line.startswith("1 25544"):
                      return float(line[18:32])
              return -1.0

          if epoch(candidate) > epoch(current):
              shutil.copyfile(candidate, current)
          PY

            if git diff --quiet -- data/iss.tle; then
              echo "TLE remoto già uguale o più recente; nessuna modifica necessaria."
              exit 0
            fi

            git add data/iss.tle
            git commit -m "Aggiorna orbita ISS"
            if git push origin HEAD:main; then
              echo "TLE pubblicato correttamente."
              exit 0
            fi

            echo "::warning::Push concorrente (tentativo $attempt/5): riprovo."
            sleep 2
          done

          echo "::warning::TLE valido conservato nel repository; riproverò al prossimo run."
          exit 0
