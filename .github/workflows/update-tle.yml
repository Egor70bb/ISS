name: Aggiorna orbita ISS

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iss-tle
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Scarica il TLE aggiornato della ISS
        run: |
          mkdir -p data
          rm -f data/iss.tle.new

          if ! curl --fail --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 60 \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            'https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE' \
            --output data/iss.tle.new; then
            echo "::warning::CelesTrak non raggiungibile. Mantengo l'ultimo TLE valido già presente nel repository."
            rm -f data/iss.tle.new
            exit 0
          fi

          if ! grep -q '^1 25544' data/iss.tle.new || ! grep -q '^2 25544' data/iss.tle.new; then
            echo "::warning::Il file ricevuto da CelesTrak non contiene un TLE ISS valido. Mantengo l'ultimo TLE valido."
            rm -f data/iss.tle.new
            exit 0
          fi

          mv data/iss.tle.new data/iss.tle

      - name: Pubblica soltanto se i dati sono cambiati
        run: |
          if git diff --quiet -- data/iss.tle; then
            echo "TLE già aggiornato oppure sorgente temporaneamente non disponibile"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iss.tle
          git commit -m "Aggiorna orbita ISS"
          git push
